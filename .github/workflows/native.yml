name: native

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test aret-native against the real engine
        run: cargo test -p aret-native -- --nocapture

  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Build libaret_native.so (arm64-v8a)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -P 24 -o jniLibs build --release -p aret-native
      - uses: actions/upload-artifact@v4
        with:
          name: libaret_native-arm64-v8a
          path: jniLibs/arm64-v8a/libaret_native.so
